          B64
          git apply --whitespace=nowarn ios10_port.patch
          # clang errors on aligned new/delete when targeting iOS<11 (not a suppressible warning); disable aligned allocation
          sed -i '' 's/-D_LIBCPP_DISABLE_AVAILABILITY/-D_LIBCPP_DISABLE_AVAILABILITY -fno-aligned-allocation/' Source/iOS/App/Project/Scripts/BuildCore.sh Source/iOS/App/Project/Config/Common.xcconfig CMakeLists.txt
          # homebrew's zstd got picked up via pkg-config (host arch, not iOS) -> force the vendored Externals/zstd
          sed -i '' 's/pkg_check_modules(ZSTD QUIET libzstd>=1.4.0 IMPORTED_TARGET)/set(ZSTD_FOUND OFF)/' CMakeLists.txt
          # the port patch removed Firebase from the project but missed two files that still import it
          A=Source/iOS/App/Common/UI
          python3 - <<'PYEOF'
          import re
          p = "Source/iOS/App/Common/UI/Emulation/EmulationViewController.mm"
          s = open(p).read()
          s = re.sub(r'[ \t]*\[FIRAnalytics logEventWithName:@"game_start" parameters:@\{.*?\}\];\n', '', s, flags=re.S)
          open(p, "w").write(s)
          PYEOF
          sed -i '' '/#import <Firebase/d' $A/Emulation/EmulationViewController.mm $A/BootNotice/Analytics/AnalyticsNoticeViewController.mm
          sed -i '' '/FIRAnalytics setAnalyticsCollectionEnabled/d;/FIRCrashlytics crashlytics/d' $A/BootNotice/Analytics/AnalyticsNoticeViewController.mm
          # vendored LLVM 16.0.6 libc++ filesystem sources (unmodified; matches Xcode 15.4 libc++)
          B=https://raw.githubusercontent.com/llvm/llvm-project/llvmorg-16.0.6/libcxx
          D=Externals/libcxx-fs-compat
          mkdir -p $D/src/filesystem $D/src/include
          for f in src/filesystem/directory_iterator.cpp src/filesystem/filesystem_common.h src/filesystem/int128_builtins.cpp src/filesystem/operations.cpp src/filesystem/posix_compat.h src/include/apple_availability.h LICENSE.TXT; do
            curl -fsSL "$B/$f" -o "$D/$f"
          done
          # Xcode 15.4 libc++ no longer defines _LIBCPP_FUNC_VIS (LLVM 16 sources still use it)
          sed -i '' 's/_LIBCPP_FUNC_VIS/__attribute__((visibility("default")))/' $D/src/filesystem/int128_builtins.cpp
          # bartycrouch isn't installed on the runner; it only refreshes storyboard strings, so skip it when missing
          sed -i '' 's/^bartycrouch update -x$/if command -v bartycrouch >\/dev\/null 2>\&1; then bartycrouch update -x; else echo "bartycrouch not found, skipping"; fi/' Source/iOS/App/Project/Scripts/UpdateStoryboardStrings.sh

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$XCODE_APP" || sudo xcode-select -s "$(ls -d /Applications/Xcode_15*.app | sort | tail -1)"
          xcodebuild -version

      - name: Install tools
        run: brew install cmake ninja ldid dpkg

      - name: Build (Jailbroken, iOS 10, arm64)
        run: |
          set -o pipefail
          xcodebuild -configuration "Release (Jailbroken)" -scheme "DiOS (JB)" $BUILD_ARGS | tee build.log | tail -n 200

      - name: Package .deb (ldid fake-sign)
        run: |
          mkdir products
          P=Source/iOS/App/Project
          $P/Scripts/CreateDebLdid.sh \
            "build-Xcode/Build/Products/Release (Jailbroken)-iphoneos/DolphiniOS.app" \
            $P/Entitlements/Private.entitlements \
            $P/Package/Deb/control-normal.in \
            $P/Package/Deb/postinst.sh \
            $P/Package/Deb/postrm.sh \
            products/DolphiniOS-iOS10.deb

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dolphinios-ios10
          path: |
            products/*.deb
            build.log
