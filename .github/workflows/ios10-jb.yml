          s = open(p).read()
          s = re.sub(r'[ \t]*\[FIRAnalytics logEventWithName:@"game_start" parameters:@\{.*?\}\];\n', '', s, flags=re.S)
          open(p, "w").write(s)
          PYEOF
          sed -i '' '/#import <Firebase/d' $A/Emulation/EmulationViewController.mm $A/BootNotice/Analytics/AnalyticsNoticeViewController.mm
          sed -i '' '/FIRAnalytics setAnalyticsCollectionEnabled/d;/FIRCrashlytics crashlytics/d' $A/BootNotice/Analytics/AnalyticsNoticeViewController.mm
          # vendored LLVM 16.0.6 libc++ filesystem sources (unmodified; matches Xcode 15.4 libc++)
          B=https://raw.githubusercontent.com/llvm/llvm-project/llvmorg-16.0.6/libcxx
          D=Externals/libcxx-fs-compat
          mkdir -p $D/src/filesystem $D/src/include
          for f in src/filesystem/directory_iterator.cpp src/filesystem/filesystem_common.h src/filesystem/int128_builtins.cpp src/filesystem/operations.cpp src/filesystem/posix_compat.h src/include/apple_availability.h LICENSE.TXT; do
            curl -fsSL "$B/$f" -o "$D/$f"
          done
          # Xcode 15.4 libc++ no longer defines _LIBCPP_FUNC_VIS (LLVM 16 sources still use it)
          sed -i '' 's/_LIBCPP_FUNC_VIS/__attribute__((visibility("default")))/' $D/src/filesystem/int128_builtins.cpp
          # bartycrouch isn't installed on the runner; it only refreshes storyboard strings, so skip it when missing
          sed -i '' 's/^bartycrouch update -x$/if command -v bartycrouch >\/dev\/null 2>\&1; then bartycrouch update -x; else echo "bartycrouch not found, skipping"; fi/' Source/iOS/App/Project/Scripts/UpdateStoryboardStrings.sh
          # scroll view content/frame layout guides need iOS 11; ibtool rejects them for target 10.0 -> pin constraints to the scroll view itself
          python3 - <<'PYEOF2'
          import re, glob, sys
          root = "Source/iOS/App"
          tag = re.compile(r'<(/?)(\w+)([^>]*?)(/?)>')
          n = 0
          for p in glob.glob(root + "/**/*.xib", recursive=True) + glob.glob(root + "/**/*.storyboard", recursive=True):
              s = open(p, encoding="utf-8").read()
              if 'key="contentLayoutGuide"' not in s:
                  continue
              stack, remap = [], {}
              for m in tag.finditer(s):
                  close, name, attrs, selfc = m.groups()
                  if name == "viewLayoutGuide":
                      k = re.search(r'key="(contentLayoutGuide|frameLayoutGuide)"', attrs)
                      i = re.search(r'\bid="([^"]+)"', attrs)
                      if k and i:
                          owner = next((x for x in reversed(stack) if x[0] in ("scrollView", "tableView", "collectionView", "textView")), None)
                          if owner:
                              remap[i.group(1)] = owner[1]
                  if close:
                      if stack: stack.pop()
                  elif not selfc:
                      i = re.search(r'\bid="([^"]+)"', attrs)
                      stack.append((name, i.group(1) if i else None))
              s = re.sub(r'[ \t]*<viewLayoutGuide key="(?:contentLayoutGuide|frameLayoutGuide)" id="[^"]+"/>\n', '', s)
              for old, new in remap.items():
                  s = re.sub(r'((?:firstItem|secondItem)=")%s(")' % re.escape(old), r'\g<1>%s\2' % new, s)
              open(p, "w", encoding="utf-8").write(s)
              print("fixed", p, remap); n += 1
          print("files", n)
          PYEOF2

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$XCODE_APP" || sudo xcode-select -s "$(ls -d /Applications/Xcode_15*.app | sort | tail -1)"
          xcodebuild -version

      - name: Install tools
        run: |
          brew install cmake ninja ldid dpkg
          # UpdateCoreStrings.py runs under /usr/bin/python3 (Xcode's python) and needs polib
          /usr/bin/python3 -m pip install --user polib
          /usr/bin/python3 -c "import polib; print('polib', polib.__version__)"

      - name: Generate touch-controller image assets
        run: |
          # The "Copy Dolphin Assets" build phase did not populate DolphinAssets.xcassets in time on CI (Assets.car had no gcpad_*/wiimote_* images,
          # TCButton.updateImage force-unwraps them -> SIGTRAP when a game starts). Generate them before xcodebuild instead.
          R=Source/Android/app/src/main/res
          echo "android drawables: $(ls $R/drawable-hdpi | wc -l) hdpi / $(ls $R/drawable-xhdpi | wc -l) xhdpi / $(ls $R/drawable-xxhdpi | wc -l) xxhdpi"
          PROJECT_DIR="$PWD/Source/iOS/App" bash Source/iOS/App/Project/Scripts/CopyAssets.sh
          X=Source/iOS/App/Common/DolphinAssets.xcassets
          echo "imagesets generated: $(ls -d $X/*.imageset | wc -l)"
          test -d $X/gcpad_a.imageset && test -f $X/gcpad_a.imageset/gcpad_a@2x.png

      - name: Patch touch-controller images (no force-unwrap) and Metal displaySyncEnabled for iOS 10
        run: |
          python3 - <<'PYEOF4'
          d = "Source/iOS/App/DolphiniOS/UI/Emulation/TouchController/"
          def patch(name, pairs, append=""):
              s = open(d + name).read()
              for old, new in pairs:
                  assert old in s, (name, old)
                  s = s.replace(old, new)
              open(d + name, "w").write(s + append)
          ext = """
          extension UIImage
          {
            // Asset catalogs built by a newer Xcode can be unreadable on old iOS (UIImage(named:) returns nil),
            // so fall back to loose name@Nx.png files in the bundle.
            static func dolphinBundleImage(named name: String, in bundle: Bundle) -> UIImage?
            {
              if let image = UIImage(named: name, in: bundle, compatibleWith: nil)
              {
                return image
              }
              
              let screenScale = Int(UIScreen.main.scale.rounded())
              
              for scale in [screenScale, 3, 2, 1]
              {
                guard let path = bundle.path(forResource: "\\(name)@\\(scale)x", ofType: "png"),
                      let image = UIImage(contentsOfFile: path),
                      let cgImage = image.cgImage else
                {
                  continue
                }
                
                return UIImage(cgImage: cgImage, scale: CGFloat(scale), orientation: .up)
              }
              
              return nil
            }
          }
          """
          patch("TCButton.swift", [
              ("let image = UIImage(named: named, in: Bundle(for: type(of: self)), compatibleWith: nil)!",
               "guard let image = UIImage.dolphinBundleImage(named: named, in: Bundle(for: type(of: self))) else { return UIImage() }"),
              ("let newImage = UIGraphicsGetImageFromCurrentImageContext()!",
               "let newImage = UIGraphicsGetImageFromCurrentImageContext() ?? image"),
          ], ext)
          patch("TCDirectionalPad.swift", [
              ("return UIImage(named: imageName, in: Bundle(for: type(of: self)), compatibleWith: nil)!",
               "return UIImage.dolphinBundleImage(named: imageName, in: Bundle(for: type(of: self))) ?? UIImage()"),
          ])
          patch("TCJoystick.swift", [
              ("let image = UIImage(named: imageName, in: Bundle(for: type(of: self)), compatibleWith: nil)\n",
               "let image = UIImage.dolphinBundleImage(named: imageName, in: Bundle(for: type(of: self)))\n"),
          ])
          # CAMetalLayer.displaySyncEnabled is not available on iOS (unrecognized selector -> abort on the emulation thread at game start)
          g = "Source/Core/VideoBackends/Metal/MTLGfx.mm"
          s = open(g).read()
          a = "[m_layer setDisplaySyncEnabled:g_ActiveConfig.bVSyncActive];"
          assert s.count(a) == 2, s.count(a)
          s = s.replace(a, "if ([m_layer respondsToSelector:@selector(setDisplaySyncEnabled:)]) " + a)
          open(g, "w").write(s)
          # MTLRenderPipelineDescriptor.rasterSampleCount is iOS 12+ (sampleCount is the iOS 8+ name); inputPrimitiveTopology is iOS 12+;
          # MTLRenderCommandEncoder.setDepthClipMode: is iOS 11+. Unrecognized selectors abort the emulation thread.
          m = "Source/Core/VideoBackends/Metal/"
          def patch_metal(name, pairs):
              s = open(m + name).read()
              for old, new in pairs:
                  assert s.count(old) == 1, (name, old, s.count(old))
                  s = s.replace(old, new)
              open(m + name, "w").write(s)
          patch_metal("MTLObjectCache.mm", [
              ("[desc setRasterSampleCount:fs.samples];", "[desc setSampleCount:fs.samples];"),
              ("[desc setInputPrimitiveTopology:GetClass(rs.primitive)];",
               "if ([desc respondsToSelector:@selector(setInputPrimitiveTopology:)]) [desc setInputPrimitiveTopology:GetClass(rs.primitive)];"),
          ])
          patch_metal("MTLStateTracker.mm", [
              ("[enc setDepthClipMode:clip];",
               "if ([enc respondsToSelector:@selector(setDepthClipMode:)]) [enc setDepthClipMode:clip];"),
          ])
          # Single-component 8/16-bit MTLVertexFormats (UChar, Short, UCharNormalized, ...) are iOS 11+. The posmtx attribute uses MTLVertexFormatUChar,
          # so on iOS 10 Metal aborts inside setFormat: on the video thread. Use the 2-component variant there (the shader attribute stays scalar).
          import re
          vf = m + "MTLVertexFormat.mm"
          s = open(vf).read()
          s, n = re.subn(r"case 1: return MTLVertexFormat((?:UChar|Char|UShort|Short)(?:Normalized)?);",
                         lambda mo: "case 1: return MTLVertexFormatCompat(MTLVertexFormat%s, MTLVertexFormat%s);" % (
                             mo.group(1), mo.group(1).replace("Normalized", "") + "2" + ("Normalized" if "Normalized" in mo.group(1) else "")), s)
          assert n == 8, n
          helper = """
          static inline MTLVertexFormat MTLVertexFormatCompat(MTLVertexFormat modern, MTLVertexFormat legacy)
          {
            if (@available(iOS 11, macOS 10.13, *))
              return modern;
            return legacy;
          }
          """
          inc = '#include "VideoCommon/VertexShaderGen.h"\n'
          assert s.count(inc) == 1
          s = s.replace(inc, inc + helper)
          open(vf, "w").write(s)
          # On-device diagnostics: log file in the app's Documents folder + crash/exception handlers that write symbolizable backtraces
          diag = r'''
          #include <dlfcn.h>
          #include <stdlib.h>
          #include <execinfo.h>
          #include <fcntl.h>
          #include <pthread.h>
          #include <signal.h>
          #include <stdarg.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <string.h>
          #include <sys/stat.h>
          #include <sys/types.h>
          #include <sys/utsname.h>
          #include <time.h>
          #include <sys/ucontext.h>
          #include <mach/mach.h>
          #include <mach/vm_map.h>
          #include <mach-o/getsect.h>
          #include <mach-o/loader.h>
          #include <unistd.h>
          #if defined(__APPLE__)
          #include <mach-o/dyld.h>
          #endif

          // ---- DolphiniOS diagnostics: writes <app container>/Documents/DolphiniOS-debug.log (previous run: ...-debug.previous.log) ----
          static int s_dol_log_fd = -1;

          static void DOLLogf(const char* fmt, ...)
          {
            if (s_dol_log_fd < 0)
              return;

            char buf[1024];
            va_list args;
            va_start(args, fmt);
            int n = vsnprintf(buf, sizeof(buf), fmt, args);
            va_end(args);

            if (n <= 0)
              return;
            if (n > (int)sizeof(buf) - 1)
              n = (int)sizeof(buf) - 1;

            ssize_t r = write(s_dol_log_fd, buf, (size_t)n);
            (void)r;
          }

          // Prints "image + offset". For libdolphin.dylib the offset equals the file address; for the main executable add 0x100000000.
          static void DOLLogFrame(unsigned idx, void* addr)
          {
            Dl_info info;
            if (dladdr(addr, &info) && info.dli_fname)
            {
              const char* base = strrchr(info.dli_fname, '/');
              base = base ? base + 1 : info.dli_fname;
              DOLLogf("  #%02u %p  %s + 0x%lx", idx, addr, base, (unsigned long)((uintptr_t)addr - (uintptr_t)info.dli_fbase));
              if (info.dli_sname && info.dli_saddr)
                DOLLogf("  (%s + 0x%lx)", info.dli_sname, (unsigned long)((uintptr_t)addr - (uintptr_t)info.dli_saddr));
              DOLLogf("\n");
            }
            else
            {
              DOLLogf("  #%02u %p\n", idx, addr);
            }
          }

          static void DOLLogBacktrace(const char* title)
          {
            void* frames[64];
            int n = backtrace(frames, 64);
            DOLLogf("%s\n", title);
            for (int i = 0; i < n; i++)
              DOLLogFrame((unsigned)i, frames[i]);
          }

          static const char* DOLSignalName(int sig)
          {
            switch (sig)
            {
            case SIGABRT: return "SIGABRT";
            case SIGSEGV: return "SIGSEGV";
            case SIGBUS: return "SIGBUS";
            case SIGILL: return "SIGILL";
            case SIGTRAP: return "SIGTRAP";
            case SIGFPE: return "SIGFPE";
            default: return "SIG?";
            }
          }

          // Copies memory out of the process without risking a second fault (returns 0 when the range is unreadable).
          static int DOLSafeRead(uintptr_t addr, void* out, size_t len)
          {
            vm_size_t got = 0;
            kern_return_t kr = vm_read_overwrite(mach_task_self(), (vm_address_t)addr, (vm_size_t)len, (vm_address_t)out, &got);
            return kr == KERN_SUCCESS && got == len;
          }

          static void DOLLogCString(const char* label, uint64_t addr)
          {
            if (!addr)
              return;

            char buf[512];
            size_t room = 4096 - (size_t)(addr & 4095);  // stay inside one 4K block so the read cannot cross into unmapped memory
            size_t len = room < sizeof(buf) - 1 ? room : sizeof(buf) - 1;
            if (!DOLSafeRead((uintptr_t)addr, buf, len))
              return;

            buf[len] = 0;
            DOLLogf("    %s: %s\n", label, buf);
          }

          static double DOLResidentMB(void)
          {
            struct mach_task_basic_info info;
            mach_msg_type_number_t count = MACH_TASK_BASIC_INFO_COUNT;
            if (task_info(mach_task_self(), MACH_TASK_BASIC_INFO, (task_info_t)&info, &count) != KERN_SUCCESS)
              return -1.0;
            return (double)info.resident_size / (1024.0 * 1024.0);
          }

          // Layout of the __DATA,__crash_info section that every system image has. abort(), __assert_rtn, abort_with_reason and
          // a number of frameworks leave their message here, and it is what iOS shows as "Application Specific Information".
          struct DOLCrashInfo
          {
            uint64_t version;
            uint64_t message;
            uint64_t signature_string;
            uint64_t backtrace;
            uint64_t message2;
            uint64_t thread;
            uint64_t dialog_mode;
            uint64_t abort_cause;
          };

          static void DOLLogCrashInfoMessages(void)
          {
            DOLLogf("Crash-info messages left by system libraries (assertion / abort text):\n");

            int found = 0;
            uint32_t count = _dyld_image_count();
            for (uint32_t i = 0; i < count; i++)
            {
              const struct mach_header_64* mh = (const struct mach_header_64*)_dyld_get_image_header(i);
              if (!mh || mh->magic != MH_MAGIC_64)
                continue;

              unsigned long size = 0;
              uint8_t* section = getsectiondata(mh, "__DATA", "__crash_info", &size);
              if (!section || size < 16)
                continue;

              struct DOLCrashInfo ci;
              memset(&ci, 0, sizeof(ci));
              memcpy(&ci, section, size < sizeof(ci) ? size : sizeof(ci));
              if (!ci.message && !ci.message2 && !ci.signature_string)
                continue;

              const char* name = _dyld_get_image_name(i);
              const char* base = name ? strrchr(name, '/') : NULL;
              DOLLogf("  [%s]\n", base ? base + 1 : (name ? name : "?"));
              DOLLogCString("message", ci.message);
              DOLLogCString("message2", ci.message2);
              DOLLogCString("signature", ci.signature_string);
              found++;
            }

            if (!found)
              DOLLogf("  (none; if the message was sent through os_log it only shows up when OS_ACTIVITY_DT_MODE took effect)\n");
          }

          static void DOLLogImageUUID(uint32_t i)
          {
            const struct mach_header_64* mh = (const struct mach_header_64*)_dyld_get_image_header(i);
            if (!mh || mh->magic != MH_MAGIC_64)
              return;

            const struct load_command* lc = (const struct load_command*)(mh + 1);
            for (uint32_t c = 0; c < mh->ncmds; c++)
            {
              if (lc->cmd == LC_UUID)
              {
                const struct uuid_command* u = (const struct uuid_command*)lc;
                char hex[40];
                for (int k = 0; k < 16; k++)
                  snprintf(hex + k * 2, 3, "%02x", u->uuid[k]);
                DOLLogf("  uuid=%s\n", hex);
                return;
              }
              lc = (const struct load_command*)((const char*)lc + lc->cmdsize);
            }
          }

          // Walks the frame-pointer chain starting at the interrupted context. This reaches through system frameworks
          // (Metal, ...) where backtrace() from inside the signal handler gives up early.
          static void DOLWalkFrames(uintptr_t pc, uintptr_t lr, uintptr_t fp, uintptr_t sp)
          {
            DOLLogf("Frame-pointer backtrace from the faulting context:\n");

            unsigned idx = 0;
            DOLLogFrame(idx++, (void*)pc);
            if (lr)
              DOLLogFrame(idx++, (void*)lr);

            while (fp && idx < 48)
            {
              if ((fp & 0xf) != 0 || fp < sp)
                break;

              uintptr_t frame[2];
              if (!DOLSafeRead(fp, frame, sizeof(frame)))
                break;
              if (!frame[1])
                break;

              DOLLogFrame(idx++, (void*)frame[1]);

              if (frame[0] <= fp)
                break;
              fp = frame[0];
            }
          }

          #if defined(__arm64__)
          static void DOLLogRegisters(void* context, uintptr_t* pc, uintptr_t* lr, uintptr_t* fp, uintptr_t* sp)
          {
            ucontext_t* uc = (ucontext_t*)context;
            if (!uc || !uc->uc_mcontext)
              return;

            const _STRUCT_ARM_THREAD_STATE64* ts = &uc->uc_mcontext->__ss;
            *pc = (uintptr_t)__darwin_arm_thread_state64_get_pc(*ts);
            *lr = (uintptr_t)__darwin_arm_thread_state64_get_lr(*ts);
            *fp = (uintptr_t)__darwin_arm_thread_state64_get_fp(*ts);
            *sp = (uintptr_t)__darwin_arm_thread_state64_get_sp(*ts);

            DOLLogf("Registers: pc=0x%lx lr=0x%lx sp=0x%lx fp=0x%lx cpsr=0x%x\n", (unsigned long)*pc, (unsigned long)*lr,
                    (unsigned long)*sp, (unsigned long)*fp, (unsigned)ts->__cpsr);
            for (int i = 0; i < 29; i++)
              DOLLogf("%sx%d=0x%llx%s", (i % 4 == 0) ? "  " : " ", i, (unsigned long long)ts->__x[i],
                      (i % 4 == 3 || i == 28) ? "\n" : "");
          }
          #endif

          static volatile sig_atomic_t s_dol_in_crash = 0;

          static void DOLSignalHandler(int sig, siginfo_t* info, void* context)
          {
            if (s_dol_in_crash)
            {
              // The handler itself crashed; fall back to the default action so the process still dies cleanly.
              signal(sig, SIG_DFL);
              return;
            }
            s_dol_in_crash = 1;

            char tname[64] = "";
            pthread_getname_np(pthread_self(), tname, sizeof(tname));

            time_t now = time(NULL);
            DOLLogf("\n==== CRASH: %s (signal %d) code=%d fault_addr=%p thread=\"%s\" ====\n", DOLSignalName(sig), sig,
                    info ? info->si_code : 0, info ? info->si_addr : NULL, tname);
            DOLLogf("time: %s", ctime(&now));
            DOLLogf("resident memory: %.1f MB\n", DOLResidentMB());

            uintptr_t pc = 0, lr = 0, fp = 0, sp = 0;
          #if defined(__arm64__)
            DOLLogRegisters(context, &pc, &lr, &fp, &sp);
          #else
            (void)context;
          #endif

            DOLLogCrashInfoMessages();
            DOLLogBacktrace("Backtrace of crashing thread (backtrace()):");
            if (pc)
              DOLWalkFrames(pc, lr, fp, sp);
            DOLLogf("==== END OF CRASH ====\n");

            fsync(s_dol_log_fd);

            // Restore the default action so the system still produces its crash report
            signal(sig, SIG_DFL);
          }

          static void DOLInstallSignalHandlers(void)
          {
            const int signals[] = {SIGABRT, SIGSEGV, SIGBUS, SIGILL, SIGTRAP, SIGFPE};
            for (size_t i = 0; i < sizeof(signals) / sizeof(signals[0]); i++)
            {
              struct sigaction sa;
              memset(&sa, 0, sizeof(sa));
              sa.sa_sigaction = DOLSignalHandler;
              sa.sa_flags = SA_SIGINFO;
              sigemptyset(&sa.sa_mask);
              sigaction(signals[i], &sa, NULL);
            }
          }

          static int DOLTryOpenLogIn(const char* dir)
          {
            // Create the folder if needed (single level; parents normally exist)
            mkdir(dir, 0755);

            char path[1100];
            char prev[1100];
            snprintf(path, sizeof(path), "%s/DolphiniOS-debug.log", dir);
            snprintf(prev, sizeof(prev), "%s/DolphiniOS-debug.previous.log", dir);

            rename(path, prev);

            int fd = open(path, O_WRONLY | O_CREAT | O_TRUNC | O_APPEND, 0644);
            if (fd < 0)
              return -1;

            s_dol_log_fd = fd;
            return fd;
          }

          // Returns 1 when the log file was opened. The jailbroken build keeps its user folder in /var/mobile/Documents/DolphiniOS
          // (not inside the app container), so try that first, then the container's Documents and tmp folders.
          static int DOLOpenLog(void)
          {
            const char* home = getenv("HOME");
            char dirs[3][1024];
            int count = 0;
            snprintf(dirs[count++], sizeof(dirs[0]), "/private/var/mobile/Documents/DolphiniOS");
            if (home)
            {
              snprintf(dirs[count++], sizeof(dirs[0]), "%s/Documents", home);
              snprintf(dirs[count++], sizeof(dirs[0]), "%s/tmp", home);
            }

            int fd = -1;
            for (int i = 0; i < count && fd < 0; i++)
              fd = DOLTryOpenLogIn(dirs[i]);

            if (fd < 0)
              return 0;

            // Capture NSLog / printf / fprintf(stderr) output of the whole process
            dup2(fd, STDERR_FILENO);
            dup2(fd, STDOUT_FILENO);
            setvbuf(stdout, NULL, _IONBF, 0);

          time_t now = time(NULL);
            struct utsname un;
            uname(&un);
            DOLLogf("==== DolphiniOS debug log, started %s", ctime(&now));
            DOLLogf("device=%s kernel=%s pid=%d\n", un.machine, un.release, (int)getpid());
            return 1;
          }

          static dispatch_source_t s_dol_heartbeat = NULL;

          // Logs app state changes, memory warnings and a heartbeat with the resident size, so jetsam kills and
          // "went to background" cases are distinguishable from real crashes in the log.
          static void DOLInstallLifecycleLogging(void)
          {
            NSNotificationCenter* nc = [NSNotificationCenter defaultCenter];
            NSArray<NSString*>* names = @[
              UIApplicationDidReceiveMemoryWarningNotification, UIApplicationWillResignActiveNotification,
              UIApplicationDidBecomeActiveNotification, UIApplicationDidEnterBackgroundNotification,
              UIApplicationWillEnterForegroundNotification, UIApplicationWillTerminateNotification
            ];
            for (NSString* name in names)
            {
              [nc addObserverForName:name
                              object:nil
                               queue:nil
                          usingBlock:^(NSNotification* note) {
                            DOLLogf("[lifecycle] %s (resident %.1f MB)\n", [[note name] UTF8String], DOLResidentMB());
                          }];
            }

            s_dol_heartbeat = dispatch_source_create(DISPATCH_SOURCE_TYPE_TIMER, 0, 0, dispatch_get_global_queue(QOS_CLASS_UTILITY, 0));
            dispatch_source_set_timer(s_dol_heartbeat, dispatch_time(DISPATCH_TIME_NOW, 10 * NSEC_PER_SEC), 10 * NSEC_PER_SEC,
                                      NSEC_PER_SEC);
            dispatch_source_set_event_handler(s_dol_heartbeat, ^{
              DOLLogf("[heartbeat] resident %.1f MB\n", DOLResidentMB());
            });
            dispatch_resume(s_dol_heartbeat);
          }

          static NSUncaughtExceptionHandler* s_dol_previous_exception_handler = NULL;

          static void DOLUncaughtExceptionHandler(NSException* exception)
          {
            DOLLogf("\n==== UNCAUGHT Objective-C EXCEPTION ====\nname: %s\nreason: %s\n", [[exception name] UTF8String],
                    [[exception reason] UTF8String]);

            NSArray<NSNumber*>* addresses = [exception callStackReturnAddresses];
            for (NSUInteger i = 0; i < [addresses count]; i++)
              DOLLogFrame((unsigned)i, (void*)(uintptr_t)[addresses[i] unsignedLongLongValue]);

            DOLLogf("Symbols:\n");
            for (NSString* symbol in [exception callStackSymbols])
              DOLLogf("  %s\n", [symbol UTF8String]);

            DOLLogf("==== END OF EXCEPTION ====\n");

            if (s_dol_previous_exception_handler)
              s_dol_previous_exception_handler(exception);
          }

          static void DOLInstallDiagnostics(void)
          {
            // Best effort: ask os_log (used by the Metal runtime for assertion text) to mirror to stderr, like under Xcode.
            setenv("OS_ACTIVITY_DT_MODE", "YES", 1);

            if (!DOLOpenLog())
              return;

            NSLog(@"DolphiniOS diagnostics: iOS %@, model %@, app %@ (%@)", [[UIDevice currentDevice] systemVersion],
                  [[UIDevice currentDevice] model],
                  [[NSBundle mainBundle] objectForInfoDictionaryKey:@"CFBundleShortVersionString"],
                  [[NSBundle mainBundle] objectForInfoDictionaryKey:@"CFBundleVersion"]);

            uint32_t image_count = _dyld_image_count();
            for (uint32_t i = 0; i < image_count; i++)
            {
              const char* name = _dyld_get_image_name(i);
              if (name && strstr(name, ".app/"))
              {
                DOLLogf("image %u slide=0x%lx %s\n", i, (unsigned long)_dyld_get_image_vmaddr_slide(i), name);
                DOLLogImageUUID(i);
              }
            }

            DOLLogf("build: %s %s\n", __DATE__, __TIME__);
            DOLLogf("physical memory: %.0f MB, resident now: %.1f MB\n", [[NSProcessInfo processInfo] physicalMemory] / 1048576.0, DOLResidentMB());
            DOLInstallLifecycleLogging();

            s_dol_previous_exception_handler = NSGetUncaughtExceptionHandler();
            NSSetUncaughtExceptionHandler(&DOLUncaughtExceptionHandler);
            DOLInstallSignalHandlers();
          }

          '''
          mp = "Source/iOS/App/Common/main.m"
          s = open(mp).read()
          imp = '#import "Swift.h"\n'
          call = "  return UIApplicationMain(argc, argv, nil, appDelegateClassName);"
          assert s.count(imp) == 1 and s.count(call) == 1
          s = s.replace(imp, imp + diag)
          s = s.replace(call, "  DOLInstallDiagnostics();\n\n" + call)
          open(mp, "w").write(s)

          PYEOF4

      - name: Patch MSL version and MSAA texture type for iOS 10
        run: |
          python3 - <<'PYEOF5'
          import re
          u = "Source/Core/VideoBackends/Metal/MTLUtil.mm"
          s = open(u, newline="").read()
          if "set_msl_version(1, 2)" in s:
              print("MSL patch already applied")
          else:
              pat = re.compile(r"(\n[ \t]*)else([ \t]*\r?\n[ \t]*)options\.set_msl_version\(2,\s*0\);")
              new, n = pat.subn(
                  lambda m: m.group(1) + "else if (@available(macOS 10.13, iOS 11, *))" + m.group(2)
                  + "options.set_msl_version(2, 0);" + m.group(1)
                  + "else" + m.group(2) + "options.set_msl_version(1, 2);", s, count=1)
              print("MSL patch matches:", n)
              if n:
                  open(u, "w", newline="").write(new)
              else:
                  print("WARNING: set_msl_version(2, 0) block not found, skipped")
          g = "Source/Core/VideoBackends/Metal/MTLGfx.mm"
          s = open(g, newline="").read()
          pat = re.compile(r"\[desc setTextureType:\s*config\.samples\s*>\s*1\s*\?\s*MTLTextureType2DMultisampleArray\s*:\s*MTLTextureType2DArray\];")
          rep = ("MTLTextureType tex_type = MTLTextureType2DArray;\n"
                 "    if (config.samples > 1)\n"
                 "    {\n"
                 "      if (@available(macOS 10.14, iOS 14, *))\n"
                 "        tex_type = MTLTextureType2DMultisampleArray;\n"
                 "      else\n"
                 "        tex_type = MTLTextureType2DMultisample;\n"
                 "    }\n"
                 "    [desc setTextureType:tex_type];")
          new, n = pat.subn(lambda m: rep, s, count=1)
          print("MSAA patch matches:", n)
          if n:
              open(g, "w", newline="").write(new)
          else:
              print("WARNING: setTextureType block not found, skipped")
          PYEOF5

      - name: A7 Metal safety flags and Metal diagnostics
        run: |
          python3 - <<'PYEOF6'
          import re
          base = "Source/Core/VideoBackends/Metal/"

          def load(n):
              return open(base + n, newline="").read()

          def save(n, s):
              open(base + n, "w", newline="").write(s)

          def add_include(s, after, inc):
              if inc in s:
                  return s
              assert s.count(after) == 1, after
              return s.replace(after, after + inc + "\n")

          # ---- MTLUtil.mm: A7 capability flags + feature log ----
          s = load("MTLUtil.mm")
          if "A7-SAFE" in s:
              print("MTLUtil.mm already patched")
          else:
              s = add_include(s, "#include <fstream>\n", "#include <cstdio>")

              a1 = "  config->backend_info.bSupportsFramebufferFetch = true;\n#endif\n"
              assert s.count(a1) == 1, "framebuffer fetch anchor"
              flags = (
                  "  config->backend_info.bSupportsFramebufferFetch = true;\n"
                  "  // A7-SAFE: A7 is GPU family 1 only. Fragment-shader buffer writes / atomics (used by the bounding box)\n"
                  "  // are unverified there and the Metal runtime aborts the whole process on invalid state, so use the\n"
                  "  // core's software fallbacks on that GPU.\n"
                  "  if (![device supportsFeatureSet:MTLFeatureSet_iOS_GPUFamily2_v1])\n"
                  "  {\n"
                  "    config->backend_info.bSupportsBBox = false;\n"
                  "    config->backend_info.bSupportsFragmentStoresAndAtomics = false;\n"
                  "  }\n"
                  "#endif\n")
              s = s.replace(a1, flags)

              a2 = ("  if (DriverDetails::HasBug(DriverDetails::BUG_BROKEN_DYNAMIC_SAMPLER_INDEXING))\n"
                    "    config->backend_info.bSupportsDynamicSamplerIndexing = false;\n}\n")
              assert s.count(a2) == 1, "sampler indexing anchor"
              log = (
                  "  if (DriverDetails::HasBug(DriverDetails::BUG_BROKEN_DYNAMIC_SAMPLER_INDEXING))\n"
                  "    config->backend_info.bSupportsDynamicSamplerIndexing = false;\n"
                  "#if !TARGET_OS_OSX\n"
                  "  // stderr is captured into DolphiniOS-debug.log by the diagnostics code in main.m\n"
                  "  fprintf(stderr,\n"
                  "          \"[metal] device=\\\"%s\\\" iOS=%d.%d family1=%d family2=%d family3=%d family4=%d\\n\"\n"
                  "          \"[metal] dualsrc=%d bbox=%d fragstores=%d fbfetch=%d depthclamp=%d compute=%d gputexdecode=%d\\n\",\n"
                  "          [[device name] UTF8String], (int)cocoa_ver.majorVersion, (int)cocoa_ver.minorVersion,\n"
                  "          (int)[device supportsFeatureSet:MTLFeatureSet_iOS_GPUFamily1_v1],\n"
                  "          (int)[device supportsFeatureSet:MTLFeatureSet_iOS_GPUFamily2_v1],\n"
                  "          (int)[device supportsFeatureSet:MTLFeatureSet_iOS_GPUFamily3_v1],\n"
                  "          (int)[device supportsFeatureSet:MTLFeatureSet_iOS_GPUFamily4_v1],\n"
                  "          (int)config->backend_info.bSupportsDualSourceBlend, (int)config->backend_info.bSupportsBBox,\n"
                  "          (int)config->backend_info.bSupportsFragmentStoresAndAtomics,\n"
                  "          (int)config->backend_info.bSupportsFramebufferFetch, (int)config->backend_info.bSupportsDepthClamp,\n"
                  "          (int)config->backend_info.bSupportsComputeShaders,\n"
                  "          (int)config->backend_info.bSupportsGPUTextureDecoding);\n"
                  "#endif\n"
                  "}\n")
              s = s.replace(a2, log)
              save("MTLUtil.mm", s)
              print("MTLUtil.mm patched")

          # ---- MTLObjectCache.mm: log pipeline compile failures to the debug log before the (blocking) alert ----
          s = load("MTLObjectCache.mm")
          if "[metal] render pipeline" in s:
              print("MTLObjectCache.mm already patched")
          else:
              a = '        PanicAlertFmt("Failed to compile pipeline for {} and {}: {}",\n'
              assert s.count(a) == 1, "pipeline alert anchor"
              ins = ('        fprintf(stderr, "[metal] render pipeline compile failed: vs=%s fs=%s: %s\\n",\n'
                     '                [[[desc vertexFunction] label] UTF8String], [[[desc fragmentFunction] label] UTF8String],\n'
                     '                [[err localizedDescription] UTF8String]);\n')
              s = s.replace(a, ins + a)
              s = add_include(s, '#include "VideoBackends/Metal/MTLObjectCache.h"\n', "\n#include <cstdio>")
              save("MTLObjectCache.mm", s)
              print("MTLObjectCache.mm patched")

          # ---- MTLGfx.mm: same for compute pipelines ----
          s = load("MTLGfx.mm")
          if "[metal] compute pipeline" in s:
              print("MTLGfx.mm already patched")
          else:
              a = '        DumpBadShader(fmt::format("Failed to compile compute pipeline {}", name));\n'
              assert s.count(a) == 1, "compute pipeline anchor"
              ins = ('        fprintf(stderr, "[metal] compute pipeline compile failed (%s): %s\\n", std::string(name).c_str(),\n'
                     '                [[err localizedDescription] UTF8String]);\n')
              s = s.replace(a, ins + a)
              s = add_include(s, '#include "VideoBackends/Metal/MTLGfx.h"\n', "\n#include <cstdio>")
              save("MTLGfx.mm", s)
              print("MTLGfx.mm patched")
          PYEOF6

      - name: Build (Jailbroken, iOS 10, arm64)
        run: |
          set -o pipefail
          xcodebuild -configuration "Release (Jailbroken)" -scheme "DiOS (JB)" $BUILD_ARGS | tee build.log | tail -n 200

      - name: Dump libdolphin symbols (to resolve crash addresses)
        if: always()
        run: |
          L="build-Xcode/Build/Products/Release (Jailbroken)-iphoneos/DolphiniOS.app/Frameworks/libdolphin.dylib"
          if [ -f "$L" ]; then
            mkdir -p products
            xcrun nm -n -arch arm64 "$L" | xcrun c++filt > products/libdolphin-symbols.txt || true
            cp "$L" products/libdolphin.dylib || true
          fi

      - name: Bundle touch-controller PNGs as loose files (iOS 10 cannot read the Xcode 15 Assets.car)
        run: |
          APP="build-Xcode/Build/Products/Release (Jailbroken)-iphoneos/DolphiniOS.app"
          X=Source/iOS/App/Common/DolphinAssets.xcassets
          n=0
          for set in "$X"/*.imageset; do
            for png in "$set"/*.png; do
              cp "$png" "$APP/$(basename "$png")"; n=$((n+1))
            done
          done
          echo "copied $n loose PNGs into the app bundle"
          test -f "$APP/gcpad_a@2x.png"

      - name: Check touch-controller images are in the app
        run: |
          APP="build-Xcode/Build/Products/Release (Jailbroken)-iphoneos/DolphiniOS.app"
          ls -l "$APP/Assets.car"
          strings -a "$APP/Assets.car" | grep -c -E "gcpad_a|wiimote" || true
          strings -a "$APP/Assets.car" | grep -q "gcpad_a" || { echo "::error::gcpad_a missing from Assets.car"; exit 1; }

      - name: Fix iOS 10 load paths (IOSurface is a PrivateFramework on iOS 10)
        run: |
          APP="build-Xcode/Build/Products/Release (Jailbroken)-iphoneos/DolphiniOS.app"
          OLD=/System/Library/Frameworks/IOSurface.framework/IOSurface
          NEW=/System/Library/PrivateFrameworks/IOSurface.framework/IOSurface
          for f in "$APP"/Frameworks/*.dylib "$APP/DolphiniOS"; do
            if otool -L "$f" | grep -q "$OLD"; then
              echo "patching $f"
              install_name_tool -change "$OLD" "$NEW" "$f"
            fi
          done
          # Anything newer than iOS 10 that the binaries import from system libs (libc++ std::bad_optional_access, Metal classes added in iOS 11+, ...)
          # becomes a weak import: NULL/nil instead of a dyld abort at launch.
          cat > "$RUNNER_TEMP/weakall.py" <<'PYEOF3'
          import struct, sys
          # Make every import from a system library (/usr/lib, /System/Library) a weak import, so a symbol that
          # is missing on the running iOS version resolves to NULL instead of aborting in dyld.
          path = sys.argv[1]
          d = bytearray(open(path, "rb").read())
          magic, = struct.unpack_from("<I", d, 0)
          if magic != 0xfeedfacf:
              print("skip (not thin 64-bit Mach-O):", path); sys.exit(0)
          ncmds, = struct.unpack_from("<I", d, 16)
          off, info, libs = 32, None, []
          for _ in range(ncmds):
              cmd, size = struct.unpack_from("<II", d, off)
              if cmd in (0xC, 0x80000018, 0x8000001F, 0x80000023, 0x20):
                  no, = struct.unpack_from("<I", d, off + 8)
                  libs.append(bytes(d[off + no: off + size]).split(b"\0")[0].decode())
              elif cmd in (0x22, 0x80000022):
                  info = struct.unpack_from("<10I", d, off + 8)
              off += size
          if not info:
              print("skip (no dyld info):", path); sys.exit(0)
          def is_sys(o): return 1 <= o <= len(libs) and libs[o - 1].startswith(("/usr/lib/", "/System/Library/"))
          def uleb(i):
              r = s = 0
              while True:
                  b = d[i]; i += 1; r |= (b & 0x7f) << s; s += 7
                  if not b & 0x80: return r, i
          def sleb(i):
              while d[i] & 0x80: i += 1
              return i + 1
          weakened = set()
          for start, size in ((info[2], info[3]), (info[6], info[7])):
              i, end, ordinal, symop, sym = start, start + size, 0, None, None
              while i < end:
                  op = d[i]; hi, imm = op & 0xf0, op & 0x0f
                  i += 1
                  if hi == 0x10: ordinal = imm
                  elif hi == 0x20: ordinal, i = uleb(i)
                  elif hi == 0x30: ordinal = 0
                  elif hi == 0x40:
                      j = d.index(0, i); symop, sym = i - 1, bytes(d[i:j]); i = j + 1
                  elif hi in (0x70, 0x80, 0xA0): _, i = uleb(i)
                  elif hi == 0x60: i = sleb(i)
                  elif hi == 0xC0: _, i = uleb(i); _, i = uleb(i)
                  if hi in (0x90, 0xA0, 0xB0, 0xC0) and symop is not None and is_sys(ordinal):
                      if not d[symop] & 1:
                          d[symop] |= 1
                          weakened.add(sym.decode())
          open(path, "wb").write(d)
          print("weakened %d system imports in %s" % (len(weakened), path))
          for n in sorted(weakened): print("  ", n)
          PYEOF3
          mkdir -p products
          for f in "$APP/DolphiniOS" "$APP"/Frameworks/*.dylib; do python3 "$RUNNER_TEMP/weakall.py" "$f"; done | tee products/weakened-symbols.txt
          echo "== remaining references to IOSurface =="
          for f in "$APP"/Frameworks/*.dylib "$APP/DolphiniOS"; do otool -L "$f" | grep -H --label="$f" IOSurface || true; done
          echo "== system frameworks referenced by non-Swift libs =="
          for f in "$APP/DolphiniOS" "$APP"/Frameworks/libdolphin.dylib "$APP"/Frameworks/libMoltenVK.dylib; do echo "-- $f"; otool -L "$f" | grep -E "/System/Library/(Private)?Frameworks" | awk '{print $1}'; done

      - name: Package .deb (ldid fake-sign)
        run: |
          mkdir -p products
          P=Source/iOS/App/Project
          bash $P/Scripts/CreateDebLdid.sh \
            "build-Xcode/Build/Products/Release (Jailbroken)-iphoneos/DolphiniOS.app" \
            $P/Entitlements/Private.entitlements \
            $P/Package/Deb/control-normal.in \
            $P/Package/Deb/postinst.sh \
            $P/Package/Deb/postrm.sh \
            products/DolphiniOS-iOS10.deb

      - name: Package .ipa (ldid fake-sign)
        run: |
          APP="build-Xcode/Build/Products/Release (Jailbroken)-iphoneos/DolphiniOS.app"
          ENT="$PWD/Source/iOS/App/Project/Entitlements/Private.entitlements"
          T=$(mktemp -d)
          mkdir "$T/Payload"
          cp -R "$APP" "$T/Payload/"
          A="$T/Payload/DolphiniOS.app"
          for f in "$A"/Frameworks/*.dylib; do [ -e "$f" ] && ldid -S "$f" || true; done
          ldid -S"$ENT" "$A/$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$A/Info.plist")"
          (cd "$T" && zip -qry "$GITHUB_WORKSPACE/products/DolphiniOS-iOS10.ipa" Payload)
          ls -l products

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dolphinios-ios10
          path: |
            products/*.deb
            products/*.ipa
            products/weakened-symbols.txt
            products/libdolphin-symbols.txt
            products/libdolphin.dylib
            build.log
